<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="assets/images/logo.ico" type="image/x-icon">
</head>

<body>

    <!-- ===== ЭКРАН ВХОДА ===== -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-box">
            <img class="auth-logo" src="assets/images/logo.png" alt="Логотип">
            <input id="authLogin" type="text" placeholder="Логин">
            <input id="authPassword" type="password" placeholder="Пароль">
            <button id="authBtn">Войти</button>
            <p id="authError" class="auth-error"></p>
        </div>
    </div>

    <!-- ===== ОСНОВНОЙ ИНТЕРФЕЙС ===== -->
    <div id="app" class="app hidden">
        <div class="content">
            <header class="header">
                <img class="links" id="accountBtn" src="assets/images/account.png" alt="Аккаунт">
                <div class="logo">
                    <img src="assets/images/logo.png" alt="Логотип">
                    <p>Кексы ручной работы</p>
                </div>
                <img class="links" id="basketToggle" src="assets/images/basket.png" alt="Корзина">
            </header>

            <main class="main">
                <div id="catalog" class="catalog_container"></div>
            </main>
        </div>

        <aside class="aside">
            <div class="basket">
                <h2>Корзина</h2>
                <div class="basket_items"></div>
                <div class="basket-total">Итого: 0 ₽</div>
                <button id="checkoutBtn" class="btn-checkout">Заказать</button>
            </div>
        </aside>
    </div>

    <!-- ===== ПОПАП ДОБАВЛЕНИЯ ТОВАРА (admin) ===== -->
    <div id="addProductModal" class="modal hidden">
        <div class="modal-box">
            <h2>Добавить товар</h2>
            <input id="newName" type="text" placeholder="Название">
            <input id="newDesc" type="text" placeholder="Описание">
            <input id="newPrice" type="number" placeholder="Цена">
            
            <label class="file-label">
                Фото товара
                <input id="newImgFile" type="file" accept="image/*">
            </label>

            <img id="newImgPreview" class="preview hidden" alt="Превью товара">

            <button id="addProductDone">Готово</button>
            <button id="addProductCancel" class="btn-cancel">Отмена</button>
        </div>
    </div>

    <!-- ===== ПОПАП УСПЕХА ===== -->
    <div id="successModal" class="modal hidden">
        <div class="modal-box">
            <h2>Карточка успешно добавлена</h2>
            <button id="successOk">ОК</button>
        </div>
    </div>

    <!-- ===== ПОПАП ЗАКАЗА ===== -->
    <div id="checkoutModal" class="modal hidden">
        <div class="modal-box">
            <h2>Доступно в следующей версии</h2>
            <button id="checkoutOk">ОК</button>
        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
